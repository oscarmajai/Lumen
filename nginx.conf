server {
    listen 80;
    server_name localhost;

    # Sirve los archivos estáticos de React
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Redirige las peticiones /api/ a tu backend Fastify
    location /api/ {
        # 'backend' es el nombre del servicio en docker-compose
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Aumentar límites para subida de archivos pesados (PDFs)
        client_max_body_size 20M;

        # SSE / streaming: sin buffer para que los eventos lleguen en tiempo real
        proxy_buffering      off;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }
}

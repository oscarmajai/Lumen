<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#164e63;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo circle -->
  <circle cx="600" cy="200" r="72" fill="#facc15" opacity="0.15"/>
  <circle cx="600" cy="200" r="52" fill="#facc15" opacity="0.25"/>
  <!-- Lightbulb -->
  <text x="600" y="222" font-size="52" text-anchor="middle" fill="#facc15">💡</text>

  <!-- Title -->
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="#f8fafc">Lumen</text>

  <!-- Subtitle -->
  <text x="600" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="32" text-anchor="middle" fill="#94a3b8">IA de Conocimiento para Empresas</text>

  <!-- Tagline -->
  <text x="600" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle" fill="#64748b">Conecta a tu equipo con el conocimiento de tu empresa</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#facc15" opacity="0.1"/>
  <text x="600" y="616" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="middle" fill="#facc15">lumen.oscarmajai.dev</text>
</svg>
